[package]
name = "synctui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
env_logger = "0.11.11"
futures = "0.3.32"
log = "0.4.33"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive"] }
syncthing-rs = { git = "https://github.com/hertelukas/syncthing-rs.git", branch = "main" }
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
tui-qrcode = "0.2.6"

[profile.release]
lto = true
codegen-units = 1
